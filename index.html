<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="资产看板">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="手动记录、数据只存在本机的个人资产看板">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<title>资产看板</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <header class="nav" id="nav">
    <span></span>
    <strong class="nav-t" id="nt"></strong>
    <div class="nav-r" id="navr"></div>
  </header>
  <div class="large"><div class="date" id="today"></div><h1 id="lt"></h1></div>
  <div id="banner"></div>
  <main>
    <div class="panel" id="v-home"></div>
    <div class="panel" id="v-acc" hidden></div>
    <div class="panel" id="v-set" hidden></div>
  </main>
</div>

<nav class="tabbar" aria-label="主导航"><div class="in">
  <button class="tab" data-act="tab" data-v="home"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12h8.5"/></svg>总览</button>
  <button class="tab" data-act="tab" data-v="acc"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h3"/></svg>账户</button>
  <button class="tab" data-act="tab" data-v="set"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>设置</button>
</div></nav>

<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" hidden></div>

<noscript><p style="padding:24px;text-align:center">资产看板需要启用 JavaScript。</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
