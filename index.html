<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="资产看板">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="手动记录、数据只存在本机的个人资产看板">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<title>资产看板</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <header class="nav" id="nav">
    <div class="nav-l" id="navl"></div>
    <strong class="nav-t" id="nt"></strong>
    <div class="nav-r" id="navr"></div>
  </header>
  <div class="large"><div class="date" id="today"></div><h1 id="lt"></h1></div>
  <div id="banner"></div>
  <main>
    <div class="panel" id="v-home"></div>
    <div class="panel" id="v-acc" hidden></div>
    <div class="panel" id="v-set" hidden></div>
  </main>
</div>

<nav class="tabbar" aria-label="主导航"><div class="in">
  <button class="tab" data-act="tab" data-v="home">总览</button>
  <button class="tab" data-act="tab" data-v="acc">账户</button>
  <button class="tab" data-act="tab" data-v="set">设置</button>
</div></nav>

<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px;text-align:center">资产看板需要启用 JavaScript。</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
